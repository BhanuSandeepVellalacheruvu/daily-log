name: Daily Log

on:
  schedule:
    # 2:30 AM UTC is 8:00 AM IST
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Append to daily log
        run: |
          echo "- $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> daily-log.md
      
      - name: Commit and push changes
        run: |
          git config --global user.name "Bhanu sandeep"
          git config --global user.email "118993028+BhanuSandeepVellalacheruvu@users.noreply.github.com"
          git add daily-log.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update daily log"
            git push
          fi
